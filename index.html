    <title>Plan Under Pressure — BOW Decision Challenges</title>
    <meta name="description" content="An applied financial-literacy challenge for Grades 5–8. Students build an eight-week money plan, repair it when conditions change, and defend it with their own numbers." />
    <!--
      What this page is allowed to load and where it is allowed to talk.

      A security review found no CSP anywhere, and no clickjacking or sniffing protection. What
      actually keeps the stored names a reviewer planted inert is React's escaping — this is
      what stops the next mistake being an executing one, and it is cheap here because the
      product genuinely has no third party in it: no analytics, no CDN, no web font, no tracker.
      `connect-src 'self'` says the same thing in a way a reviewer can check: a student's
      written explanation is never sent anywhere but this deployment's own API.

      `style-src` allows inline because the bundler inlines the critical stylesheet and a few
      components set measured sizes; nothing inlines script, so `script-src` does not.

      `frame-ancestors` is deliberately absent here: a browser ignores it in a meta element and
      logs that it has. It is sent as a real header — with HSTS, which a meta element cannot
      carry at all — from `vercel.json` on the managed host and from `server/index.ts` on the
      API. A directive that is silently dropped is worse than no directive, because a reviewer
      reading this file would count it.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'" />
    <meta name="referrer" content="same-origin" />

    <meta name="theme-color" content="#0B1B33" />
