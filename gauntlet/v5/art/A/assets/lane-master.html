<!doctype html>
<meta charset="utf-8">
<!--
  Direction A — the lane plate, authoring master.

  Everything the student sees THROUGH the service window: sky, the stall row across the lane,
  string lights, wet asphalt, haze, our own awning framing the top. No text, no numbers, no UI —
  the plate is pure environment and is baked once per time-of-day grade with
  scripts/bake-art.mjs. The near queue and the counter are NOT here; they are live DOM,
  composited over this at runtime, because they derive from real world state.

  Grades: <html class="dusk|mid|late"> — 18:05 blue hour / 19:35 full dark peak / 20:40 late.
-->
<html class="late">
<style>
  html, body { margin: 0; width: 1366px; height: 460px; overflow: hidden; background: #000; }

  /* ------------------------------------------------------------------ grade knobs */
  html.dusk {
    --sky-top: #24365e; --sky-mid: #3b4c74; --sky-hor: #8a6547; --sky-ground: #4a3421;
    --haze-op: .3; --bulb-op: .8; --pool-op: .82; --stall-glow: .85;
    --stars-d: none; --moths-d: none;
  }
  html.mid {
    --sky-top: #0b1330; --sky-mid: #182848; --sky-hor: #543823; --sky-ground: #2e1d11;
    --haze-op: .2; --bulb-op: 1; --pool-op: 1; --stall-glow: 1;
    --stars-d: none; --moths-d: block;
  }
  html.late {
    --sky-top: #050810; --sky-mid: #0d1224; --sky-hor: #3b2517; --sky-ground: #22150c;
    --haze-op: .15; --bulb-op: 1; --pool-op: 1; --stall-glow: 1;
    --stars-d: block; --moths-d: block;
  }
  /* baked crowd density per grade */
  html.dusk  .crowd-mid, html.dusk  .crowd-dense { display: none; }
  html.mid   .crowd-sparse, html.mid  .crowd-mid { display: none; }
  html.late  .crowd-dense, html.late  .crowd-sparse { display: none; }
  html.dusk  .steam { opacity: 1.3; }

  .bulbs { opacity: var(--bulb-op); }
  .pool  { opacity: var(--pool-op); }
  .stall-glow { opacity: var(--stall-glow); }
  .stars { display: var(--stars-d); }
  .moths { display: var(--moths-d); }
</style>
<body>
<svg width="1366" height="460" viewBox="0 0 1366 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--sky-top)"/>
      <stop offset=".42" style="stop-color:var(--sky-mid)"/>
      <stop offset=".78" style="stop-color:var(--sky-hor)"/>
      <stop offset="1" style="stop-color:var(--sky-ground)"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221610"/>
      <stop offset=".35" stop-color="#120c08"/>
      <stop offset="1" stop-color="#080505"/>
    </linearGradient>
    <radialGradient id="warmpool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc267" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#e8752a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e8752a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stallglowA" cx=".5" cy=".4" r=".65">
      <stop offset="0" stop-color="#ffb060" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffb060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="counterwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#553318"/>
      <stop offset="1" stop-color="#26140b"/>
    </linearGradient>
    <linearGradient id="wash-up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd48a" stop-opacity=".26"/>
      <stop offset=".7" stop-color="#ffd48a" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffd48a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lantern" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#ffe3ae"/>
      <stop offset=".7" stop-color="#f08a3c"/>
      <stop offset="1" stop-color="#c2551e"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".46" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
    <linearGradient id="citumglow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a8501e" stop-opacity=".3"/>
      <stop offset="1" stop-color="#c96a2e" stop-opacity="0"/>

    <filter id="b1"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b16"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b28"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- one hanging bulb: pendant wire, halo, glow, hot core -->

    <!-- figure: leaning on a counter, weight forward -->

    <!-- contact shadow -->

  </defs>
