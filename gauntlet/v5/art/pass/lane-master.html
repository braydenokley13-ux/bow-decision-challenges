<!doctype html>
<meta charset="utf-8">
<!--
  THE PASS — lane plate, authoring master (synthesis build).
  ============================================================================

  This is the environment the student sees THROUGH their own service window on
  Saturday night. It descends from Direction A's lane-master (the best drawing
  in the war — its stall recipe, figure recipe and wet-ground recipe are kept)
  recomposed for Direction C's chassis and for the fiction the brief demands:

    THE STUDENT IS BEHIND THEIR OWN WINDOW LOOKING OUT.  The bottom of the
    frame is our own counter surface, foreshortened, with a hot bullnose where
    it drops away to the lane. Our own hatch light is the dominant pool on the
    wet ground beyond it. The other stalls recede across the lane. Near
    passers-by are cropped by our counter's edge, the way close people are
    cropped by any real window.

  WHAT THIS FILE IS FOR
    Authoring only. Deliberately expensive (large blurs, dozens of layers) —
    a Chromebook never runs it. It is baked once per grade with:

      source scripts/browser-env.sh
      node scripts/bake-art.mjs gauntlet/v5/art/pass/lane-master.html \
           gauntlet/v5/art/pass/lane-<grade>.webp \
           --width 1920 --height 520 --scale 2 --quality 0.82

    bake-art.mjs cannot pass a query string, so ./regen.sh flips the
    data-grade attribute with sed into a temp copy per grade and bakes all
    three. In a browser you can preview any grade with ?grade=early|peak|late.

  THE RULES THIS DRAWING IS UNDER (do not "improve" past them)
    1. THE PLATE IS CONSTANT. It never varies with stock, crowd, or any world
       state. The drawn people are atmosphere, not information: the SAME
       figures appear in all three grades, so nothing about the crowd can be
       read off the plate. (Direction A varied crowd density per grade; that
       is deliberately dropped here — a student comparing two screenshots must
       find only light changed.)
    2. NO QUANTITIES. No plates, no trays, no stock, nothing countable that
       could track anything. Other vendors' counters carry produce and pans,
       never dishware in rows. No walker carries a plate.
    3. THE ONLY VARIATION IS LIGHT, keyed to the clock, which is public
       (the market runs 17:00-22:00). Three grades of one geometry:
         early — still blue, light in the sky, lamps just winning
         peak  — full dark, lamps dominant
         late  — thinning: cooler, some stalls dark, far lights out
    4. FIGURES follow A's recipe or they don't ship: necks, ears, sloping
       shoulders, jacket hems, a weight-bearing leg, no face, never pure
       black, one warm rim where a real light would put it. Anything added
       later without this recipe will read as pawns while passing every byte
       budget silently.

  GEOMETRY MAP (canvas 1920x520 — used by PLATE.md; keep in sync if you move
  anything, because the chassis positions DOM instruments against these zones)
    y   0- 54   our awning underside + occlusion (the chassis valance overlays this)
    y  54-268   sky; near string of our own bulbs sags to y~196 at centre
    y 250-300   far skyline + market glow, hazed
    x  90- 470  STALL 1 (nearest, warm red canopy), base ~y378, customers to y~376
    x 850-1130  STALL 2 (mid, teal canopy), base ~y340
    x1400-1580  STALL 3 (far, hazed; DARK in the late grade), base ~y326
    x1620-1840  bridge gate, far right, in haze
    x 640- 730  standing barrel table, two people eating
    x 470- 640  big cool puddle;  x1150-1240 far puddle;  manhole x~880
    cx 960      OUR hatch-light pool on the lane, the dominant source
    x 380- 470  near walker (cropped by our counter);  x1240-1420 near pair
    y 462-470   dark seam: the lane disappearing behind our counter
    y 470-479   BULLNOSE — the counter's far edge, hottest specular on the plate
    y 479-520   OUR COUNTER SURFACE, foreshortened, lit by our own pass lamp
    Safe zone (measured in the chassis mimic, not estimated): at 1366x768 the
    view band is 1258x335 — cover-fit shows the full width and shaves ~6px
    vertically. At 1024x600 the band is 916x259 — the full height shows and
    ~40px is cropped from EACH SIDE. Keep essential content inside
    x in [48,1872]; the vertical extent is safe everywhere measured.

  WHY 1920x520 (not C's 1920x420):
    C's chassis fits the plate with background-size:cover into a view band of
    ~1258x335 at 1366x768 — aspect 3.75:1. A 420-tall plate covers by HEIGHT
    and throws ~170px of drawing off each side. 520 tall matches the band's
    aspect (3.69:1), so at 1366 the full width survives with ~6px of vertical
    crop — and the extra 100px is exactly where the fiction fix lives: the
    near sill and our light pool at the bottom of the frame.
-->
<html data-grade="peak">
<script>
  /* Preview switch: lane-master.html?grade=early|peak|late.
     The bake goes through regen.sh, which rewrites data-grade instead,
     because bake-art.mjs resolves a bare file path (no query string). */
  (function () {
    var g = new URLSearchParams(location.search).get("grade");
    if (g === "early" || g === "peak" || g === "late") {
      document.documentElement.dataset.grade = g;
    }
  })();
</script>
<style>
  html, body { margin: 0; width: 1920px; height: 520px; overflow: hidden; background: #000; }

  /* ------------------------------------------------------------------ grade knobs
     Everything a grade may touch is a light value. No geometry, no figures.
     --sky-*      the four sky stops
     --haze-op    horizon haze density (thick early, thin late)
     --bulb-op    string bulbs (barely winning early, full after dark)
     --pool-op    our own hatch pool (we are open 17:00-22:00, so never off)
     --stall-glow lit stall interiors (stalls 1 & 2)
     --c-lit      stall 3's light ONLY — 0 in late ("some stalls dark")
     --farstring  the deep string behind the stalls — dims late
     --far-borough  lit windows on the far skyline
     --stars-op / --moths-d   full-dark dressing
     --amb        cool ambient lift on the ground (blue-hour light early)
     --sheen-op   the sky mirrored in the wet lane (bright early, dim late)
     --cool-grade late-night cool wash over everything beyond the counter   */
  html[data-grade="early"] {
    --sky-top: #2a3d68; --sky-mid: #44547a; --sky-hor: #8a6547; --sky-ground: #4a3421;
    --haze-op: .32; --bulb-op: .78; --pool-op: .9; --stall-glow: .85;
    --c-lit: .9; --farstring: .8; --far-borough: .5;
    --stars-op: 0; --moths-d: none;
    --amb: .11; --sheen-op: .08; --cool-grade: 0; --c-dark: 0; --pool-rewarm: 0;
  }
  html[data-grade="peak"] {
    --sky-top: #081026; --sky-mid: #131f3e; --sky-hor: #543823; --sky-ground: #2e1d11;
    --haze-op: .2; --bulb-op: 1; --pool-op: 1; --stall-glow: 1;
    --c-lit: 1; --farstring: 1; --far-borough: 1;
    --stars-op: .55; --moths-d: block;
    --amb: .05; --sheen-op: .06; --cool-grade: 0; --c-dark: 0; --pool-rewarm: 0;
  }
  html[data-grade="late"] {
    --sky-top: #04070f; --sky-mid: #0c1226; --sky-hor: #2e2130; --sky-ground: #1c1418;
    --haze-op: .13; --bulb-op: 1; --pool-op: 1; --stall-glow: .92;
    --c-lit: 0; --farstring: .35; --far-borough: .6;
    --stars-op: 1; --moths-d: block;
    --amb: .09; --sheen-op: .05; --cool-grade: .12; --c-dark: .34; --pool-rewarm: .5;
  }

  .bulbs      { opacity: var(--bulb-op); }
  .pool       { opacity: var(--pool-op); }
  .stall-glow { opacity: var(--stall-glow); }
  .c-lit      { opacity: var(--c-lit); }
  .farstring  { opacity: var(--farstring); }
  .stars      { opacity: var(--stars-op); }
  .moths      { display: var(--moths-d); }
  /* steam reads strongest against the blue hour, almost gone late */
  html[data-grade="early"] .steam { opacity: 1.25; }
  html[data-grade="late"]  .steam { opacity: .6; }
</style>
<body>
<svg width="1920" height="520" viewBox="0 0 1920 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ============================== gradients ============================== -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--sky-top)"/>
      <stop offset=".42" style="stop-color:var(--sky-mid)"/>
      <stop offset=".78" style="stop-color:var(--sky-hor)"/>
      <stop offset="1" style="stop-color:var(--sky-ground)"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241812"/>
      <stop offset=".3" stop-color="#14100c"/>
      <stop offset="1" stop-color="#0a0807"/>
    </linearGradient>
    <!-- our own hatch light thrown onto the lane from behind the camera -->
    <radialGradient id="warmpool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc267" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#e8752a" stop-opacity=".14"/>
      <stop offset="1" stop-color="#e8752a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stallglow" cx=".5" cy=".4" r=".65">
      <stop offset="0" stop-color="#ffc677" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffb060" stop-opacity="0"/>
    </radialGradient>
    <!-- ends of the counter fall out of our lamp's throw -->
    <linearGradient id="bullfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset=".26" stop-color="#000" stop-opacity="0"/>
      <stop offset=".74" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="counterwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#553318"/>
      <stop offset="1" stop-color="#26140b"/>
    </linearGradient>
    <!-- vertical mirror smear: how every light pays twice on wet asphalt -->
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd48a" stop-opacity=".34"/>
      <stop offset=".7" stop-color="#ffd48a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffd48a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lantern" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#ffe3ae"/>
      <stop offset=".7" stop-color="#f08a3c"/>
      <stop offset="1" stop-color="#c2551e"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".46" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
    <!-- warm market glow rising behind the whole stall row -->
    <linearGradient id="citumglow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a8501e" stop-opacity=".3"/>
      <stop offset="1" stop-color="#c96a2e" stop-opacity="0"/>
    </linearGradient>
    <!-- awning occlusion at the very top of the frame -->
    <linearGradient id="topshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <!-- OUR counter surface: far side (top) catches the lane's warmth,
         near side (bottom) falls into our own under-counter shadow -->
    <linearGradient id="sillface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f5c2e"/>
      <stop offset=".4" stop-color="#5c3a1c"/>
      <stop offset="1" stop-color="#2b1a0c"/>
    </linearGradient>
    <linearGradient id="bullnose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c184"/>
      <stop offset=".5" stop-color="#c98a44"/>
      <stop offset="1" stop-color="#7e4c20"/>
    </linearGradient>

    <!-- ============================== blurs ============================== -->
    <filter id="b1" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="b2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b4" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b8" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b16" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b28" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- ============================== bulbs ==============================
         Three-layer bloom: wide halo, tight glow, hot core. One dead bulb is
         placed inline on the near string (a market truth: one always is). -->
    <g id="bulb">
      <line x1="0" y1="-14" x2="0" y2="0" stroke="#1a100a" stroke-width="1.6"/>
      <circle r="18" fill="#ffb347" opacity=".15" filter="url(#b8)"/>
      <circle r="8" fill="#ffcf74" opacity=".6" filter="url(#b2)"/>
      <circle r="3.2" fill="#fff4d6"/>
    </g>
    <g id="bulb-s">
      <line x1="0" y1="-10" x2="0" y2="0" stroke="#150d08" stroke-width="1.2"/>
      <circle r="10" fill="#ffb347" opacity=".14" filter="url(#b4)"/>
      <circle r="5" fill="#ffcf74" opacity=".55" filter="url(#b1)"/>
      <circle r="2" fill="#ffefc9"/>
    </g>

    <!-- ============================== figures ==============================
         Direction A's silhouette recipe, kept verbatim where possible.
         Origin at the feet, adults ~140 tall before scaling. Every figure:
         neck under the head, ears implied by the skull ellipse, sloping
         shoulders, jacket hem, weight-bearing leg, one warm rim stroke.
         Colors live in the #12-#1f range — never pure black. -->

    <!-- standing, back three-quarter, hands in pockets -->
    <g id="fig-wait">
      <path d="M-8,-2 L-10,-6 -3,-8 -1,-2 Z" fill="#0e0805"/>
      <path d="M4,-2 L3,-7 10,-8 11,-3 Z" fill="#0e0805"/>
      <path d="M-5,-58 L-7,-8" stroke="#150d09" stroke-width="9" stroke-linecap="round"/>
      <path d="M5,-58 C8,-40 4,-22 7,-8" stroke="#150d09" stroke-width="9" stroke-linecap="round"/>
      <path d="M-14,-112 C-17,-92 -16,-72 -12,-56 L13,-56 C16,-76 16,-96 12,-112 C5,-117 -7,-117 -14,-112 Z" fill="#171009"/>
      <path d="M-13,-107 C-19,-92 -17,-80 -9,-71" stroke="#171009" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M13,-107 C19,-92 17,-80 9,-71" stroke="#171009" stroke-width="8" stroke-linecap="round" fill="none"/>
      <rect x="-4" y="-121" width="8" height="9" fill="#171009"/>
      <ellipse cx="0" cy="-128" rx="8.6" ry="10" fill="#171009"/>
      <path d="M-14,-110 C-17,-92 -16,-74 -13,-58" stroke="#ffb864" stroke-width="1.6" opacity=".55" fill="none" filter="url(#b1)"/>
      <path d="M-8,-136 C-12,-131 -13,-124 -11,-119" stroke="#ffb864" stroke-width="1.6" opacity=".6" fill="none" filter="url(#b1)"/>
    </g>

    <!-- hood up, shoulder bag -->
    <g id="fig-hood">
      <path d="M-8,-2 L-10,-6 -3,-8 -1,-2 Z" fill="#0e0805"/>
      <path d="M4,-2 L3,-7 10,-8 11,-3 Z" fill="#0e0805"/>
      <path d="M-5,-56 L-7,-8" stroke="#120b07" stroke-width="9" stroke-linecap="round"/>
      <path d="M5,-56 C8,-40 4,-22 7,-8" stroke="#120b07" stroke-width="9" stroke-linecap="round"/>
      <path d="M-15,-110 C-18,-90 -17,-70 -12,-54 L13,-54 C16,-74 17,-94 13,-110 C5,-116 -8,-116 -15,-110 Z" fill="#140d08"/>
      <path d="M13,-96 C17,-92 18,-80 15,-70 L4,-70 C3,-80 5,-90 8,-96 Z" fill="#0f0a06"/>
      <path d="M8,-108 C6,-100 5,-88 6,-72" stroke="#2b1c10" stroke-width="1.6" fill="none" opacity=".8"/>
      <path d="M-10,-118 C-12,-132 -2,-140 6,-138 C13,-136 16,-128 14,-118 C10,-112 -5,-112 -10,-118 Z" fill="#140d08"/>
      <path d="M-9,-134 C-4,-139 6,-140 11,-134" stroke="#ffb864" stroke-width="1.5" opacity=".55" fill="none" filter="url(#b1)"/>
      <path d="M-15,-108 C-18,-90 -17,-72 -14,-56" stroke="#ffb864" stroke-width="1.5" opacity=".5" fill="none" filter="url(#b1)"/>
    </g>

    <!-- leaning on a counter, weight forward -->
    <g id="fig-lean">
      <path d="M-9,-2 L-11,-7 -4,-9 -2,-2 Z" fill="#0e0805"/>
      <path d="M7,-2 L5,-7 12,-8 13,-2 Z" fill="#0e0805"/>
      <path d="M-6,-56 L-8,-8" stroke="#140c08" stroke-width="9" stroke-linecap="round"/>
      <path d="M8,-56 C12,-38 8,-20 10,-8" stroke="#140c08" stroke-width="9" stroke-linecap="round"/>
      <path d="M-12,-104 C-17,-88 -15,-68 -11,-54 L14,-56 C18,-78 19,-98 14,-110 C6,-116 -5,-113 -12,-104 Z" fill="#161008"/>
      <path d="M12,-102 C20,-96 26,-90 30,-84" stroke="#161008" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M-12,-100 C-18,-88 -15,-76 -8,-68" stroke="#161008" stroke-width="8" stroke-linecap="round" fill="none"/>
      <rect x="-1" y="-118" width="8" height="9" fill="#161008"/>
      <ellipse cx="5" cy="-124" rx="8.4" ry="9.7" fill="#161008" transform="rotate(8 5 -124)"/>
      <path d="M13,-104 C19,-97 24,-91 29,-86" stroke="#ffb864" stroke-width="1.5" opacity=".5" fill="none" filter="url(#b1)"/>
      <path d="M1,-132 C-3,-127 -4,-121 -2,-116" stroke="#ffb864" stroke-width="1.6" opacity=".55" fill="none" filter="url(#b1)"/>
    </g>

    <!-- walking, mid stride. A's original carried a plate; the plate is
         REMOVED here on purpose — nothing on this plate may be dishware. -->

      <path d="M12,-1 L14,-7 21,-6 20,-1 Z" fill="#0d0805"/>
      <path d="M-2,-56 C-8,-38 -12,-22 -14,-6" stroke="#130c08" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M2,-56 C8,-40 14,-20 17,-4" stroke="#130c08" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M-11,-108 C-14,-90 -13,-72 -9,-54 L11,-54 C14,-74 14,-94 10,-108 C4,-113 -5,-113 -11,-108 Z" fill="#150e08"/>
      <path d="M10,-104 C16,-99 21,-93 24,-86" stroke="#150e08" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M-10,-102 C-14,-94 -15,-86 -13,-78" stroke="#150e08" stroke-width="7" stroke-linecap="round" fill="none"/>
      <rect x="-3.5" y="-117" width="7" height="9" fill="#150e08"/>

      <path d="M3,-1 L3,-5 9,-5 9,-1 Z" fill="#0d0805"/>

      <path d="M-9,0 C-10,-14 -9,-28 -6,-38 L7,-38 C10,-28 10,-12 9,0 Z" fill="#6b5940" opacity=".55"/>

    <!-- contact shadow under standing figures -->

  </defs>

  <!-- =============================================================== SKY -->
  <rect width="1920" height="310" fill="url(#sky)"/>
  <g class="stars" fill="#cfd8ef">
    <circle cx="180" cy="40" r="1" opacity=".5"/><circle cx="410" cy="24" r=".8" opacity=".4"/>
    <circle cx="640" cy="52" r=".7" opacity=".35"/><circle cx="860" cy="30" r="1" opacity=".45"/>
    <circle cx="1080" cy="46" r=".8" opacity=".4"/><circle cx="1310" cy="22" r=".7" opacity=".35"/>
    <circle cx="1520" cy="54" r="1" opacity=".45"/><circle cx="1730" cy="34" r=".8" opacity=".4"/>
    <circle cx="1870" cy="58" r=".7" opacity=".3"/><circle cx="520" cy="14" r=".6" opacity=".3"/>

  <!-- warm market glow rising behind the whole stall row -->
  <rect x="60" y="228" width="1800" height="82" fill="url(#citumglow)" filter="url(#b16)" opacity=".55"/>

  <!-- far skyline across the river, cool, hazed; lit windows dim with the grade -->
  <g filter="url(#b4)">
    <path d="M0,270 L70,266 70,252 150,252 150,262 240,258 300,244 302,258 440,256 560,264 720,258 760,246 830,246 830,260 1010,256 1180,264 1310,258 1470,262 1560,250 1620,250 1620,262 1780,258 1920,264 1920,310 0,310 Z"
          fill="#0e1526" opacity=".6"/>
