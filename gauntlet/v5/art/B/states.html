<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Pass, reacting &mdash; Direction B states</title>
<style>
/* =========================================================================
   DIRECTION B — STYLIZED MANAGEMENT GAME
   One hand, one light, one family of objects.

   Rules this file obeys everywhere:
   - Every object = 3-value material ramp + one top highlight + one hard
     (zero-blur) drop shadow whose offset states its elevation.
   - Light comes from the bulb string: highlights on top edges, shadows
     straight down. No second light source anywhere.
   - Radii family: 6 / 10 / 16. Nothing else.
   - Text never sits on an unchecked ground. Art is aria-hidden; every fact
     is HTML text.
   - No animation. Hover/press transitions only under
     prefers-reduced-motion: no-preference.
   ========================================================================= */
:root {
  /* night */
  --night-0:#0d0705; --night-1:#180d09; --night-2:#2a1712;
  /* WOOD */
  --wood-hi:#a8825c; --wood-mid:#7c573b; --wood-dk:#553823; --wood-line:#3c2718;
  /* STEEL */
  --steel-hi:#e2e8ec; --steel-mid:#aab3ba; --steel-dk:#6b7178; --steel-deep:#454d54;
  /* PAPER (manila) */
  --paper-hi:#f8efdc; --paper-mid:#efe3c4; --paper-dk:#d6c49c;
  --paper-ink:#3a2c14; --paper-sub:#675426;
  /* inks on dark */
  --cream:#f7ecd9; --cream-dim:#d8c3a4; --cream-mute:#b99b78;
  /* the one warm mark */
  --amber:#f0a94a; --amber-hi:#ffd48a; --amber-deep:#b06d1d;
  /* money + loss, from the world's fin tokens */
  --green:#4ecf95; --red:#ff8574; --red-ink:#8f2413;
  /* shadows: hard, straight down. offset = elevation */
  --drop-sit: drop-shadow(0 7px 0 rgb(10 5 2 / .42));      /* sits on counter */
  --drop-hang: drop-shadow(0 10px 0 rgb(10 5 2 / .32));    /* hangs from wire */
  --drop-flat: drop-shadow(0 4px 0 rgb(10 5 2 / .45));     /* pinned flat */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  width:1366px; height:768px; overflow:hidden;
  background: var(--night-0);
  font-family: var(--font);
  color: var(--cream);
}

/* ---- top bar: the shell, kept quiet -------------------------------------- */
.topbar {
  height:48px; display:flex; align-items:center; gap:18px; padding:0 22px;
  background:#241a15; border-bottom:3px solid var(--amber);
  position:relative; z-index:4;
}
.topbar .mark { font-weight:800; font-size:15px; letter-spacing:.06em; color:var(--cream); }
.topbar .mark i { font-style:normal; color:var(--amber); }
.topbar .crumb { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--cream-mute); }
.topbar .crumb b { color:var(--cream-dim); font-weight:700; }
.topbar .right { margin-left:auto; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--amber-hi); }

/* ---- the stage ------------------------------------------------------------ */
.stage { position:relative; width:1366px; height:720px; }
.stage > svg.backdrop { position:absolute; inset:0; display:block; }
.obj { position:absolute; }

/* =========================================================================
   OBJECT FAMILY
   ========================================================================= */

/* -- hanging wooden signboard: the screen heading -------------------------- */
.sign-heading {
  left:30px; top:30px; width:302px; padding:16px 20px 18px;
  background:
    repeating-linear-gradient(180deg, rgb(0 0 0 / 0) 0 11px, rgb(0 0 0 / .06) 11px 12px),
    linear-gradient(180deg, var(--wood-hi), var(--wood-mid) 46%, var(--wood-dk));
  border-radius:10px;
  border-top:2px solid #c49a6c;
  filter: var(--drop-hang);
}
.sign-heading::before, .sign-heading::after {
  content:""; position:absolute; top:-30px; width:3px; height:30px;
  background:#503626;
}
.sign-heading::before { left:44px; } .sign-heading::after { right:44px; }
.sign-heading h1 {
  margin:0; font-size:21px; line-height:1.18; font-weight:800;
  letter-spacing:.045em; text-transform:uppercase; color:var(--cream);
  text-shadow:0 2px 0 rgb(0 0 0 / .35);
}

/* -- hanging clock sign ----------------------------------------------------- */
.clock {
  right:30px; top:26px; width:208px; padding:12px 18px 12px; text-align:center;
  background: linear-gradient(180deg, #241610, #1a100c);
  border:3px solid var(--wood-dk); border-top-color:#7c573b;
  border-radius:10px;
  filter: var(--drop-hang);
}
.clock::before, .clock::after {
  content:""; position:absolute; top:-29px; width:3px; height:29px; background:#503626;
}
.clock::before { left:36px; } .clock::after { right:36px; }
.clock .t {
  display:block; font-family:var(--mono); font-size:38px; line-height:1;
  font-weight:700; color:var(--amber-hi); letter-spacing:.04em;
  font-variant-numeric: tabular-nums;
}
.clock .sub {
  display:block; margin-top:6px; font-size:10.5px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--cream-mute);
}

/* -- the lane: a wooden order rail with paper chits ------------------------- */
.lane {
  left:30px; top:158px; width:268px; padding:14px 16px 18px;
  background:
    repeating-linear-gradient(180deg, rgb(0 0 0 / 0) 0 13px, rgb(0 0 0 / .05) 13px 14px),
    linear-gradient(180deg, var(--wood-hi), var(--wood-mid) 40%, var(--wood-dk));
  border-radius:10px;
  border-top:2px solid #c49a6c;
  filter: var(--drop-sit);
}
.lane h2 {
  margin:0 0 6px; font-size:11.5px; font-weight:800; letter-spacing:.18em;
  text-transform:uppercase; color:#f3dfbe; text-shadow:0 1px 0 rgb(0 0 0 / .4);
}
.lane .count { margin:0 0 12px; font-size:14px; color:var(--cream); }
.lane .count strong { font-size:30px; font-weight:800; line-height:1; margin-right:6px; font-variant-numeric:tabular-nums; }
.lane ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.chit {
  position:relative; display:flex; align-items:baseline; justify-content:space-between;
  padding:12px 14px 11px;
  background: linear-gradient(180deg, var(--paper-hi), var(--paper-mid) 55%, var(--paper-dk));
  border-radius:6px; color:var(--paper-ink);
  filter: var(--drop-flat);
}
.chit::before { /* steel pin */
  content:""; position:absolute; top:-5px; left:50%; margin-left:-5px;
  width:10px; height:10px; border-radius:50%;
  background: radial-gradient(circle at 35% 30%, var(--steel-hi), var(--steel-mid) 55%, var(--steel-deep));
}
.chit .no { font-family:var(--mono); font-weight:700; font-size:16px; }
.chit .qty { font-size:14px; font-weight:700; }
.chit:nth-child(odd) { transform:rotate(-.7deg); }
.chit:nth-child(even) { transform:rotate(.6deg); }

/* -- the ticket at the pass: the dominant object ---------------------------- */
.ticket {
  left:332px; top:208px; width:278px; padding:20px 24px 0;
  background:
    repeating-linear-gradient(180deg, rgb(0 0 0 / 0) 0 5px, rgb(94 74 33 / .03) 5px 6px),
    linear-gradient(180deg, var(--paper-hi), var(--paper-mid) 45%, var(--paper-dk));
  color:var(--paper-ink);
  border-radius:8px 8px 0 0;
  transform:rotate(-1.4deg);
  filter: var(--drop-hang);
}
.ticket::before { /* punched hole */
  content:""; position:absolute; top:10px; left:50%; margin-left:-7px;
  width:14px; height:14px; border-radius:50%;
  background:var(--night-1);
  box-shadow: inset 0 2px 0 rgb(0 0 0 / .5), 0 1px 0 var(--paper-hi);
}
.ticket .eyebrow {
  margin:8px 0 0; font-size:11px; font-weight:800; letter-spacing:.24em;
  text-transform:uppercase; color:var(--paper-sub); text-align:center;
}
.ticket .no {
  margin:2px 0 0; text-align:center; font-family:var(--mono);
  font-size:44px; font-weight:700; line-height:1; letter-spacing:.02em;
}
.ticket hr { border:0; border-top:2px dashed var(--paper-dk); margin:12px 0 10px; }
.ticket .want { margin:0; text-align:center; font-size:30px; font-weight:800; letter-spacing:.02em; }
.ticket .when { margin:4px 0 0; text-align:center; font-size:12.5px; color:var(--paper-sub); font-weight:600; }
.ticket .stampband {
  margin:14px -24px 0; height:64px;
  background: repeating-linear-gradient(180deg, rgb(94 74 33 / 0) 0 14px, rgb(94 74 33 / .22) 14px 15px);
  border-top:1px solid var(--paper-dk);
  display:flex; align-items:center; justify-content:center;
}
.ticket .stampband span {
  font-size:10px; font-weight:800; letter-spacing:.3em; text-transform:uppercase;
  color:#b3a077;
}
.ticket .tear {
  margin:0 -24px; height:12px;
  background: linear-gradient(180deg, var(--paper-dk), var(--paper-mid));
  clip-path: polygon(0 0,100% 0,100% 30%,96% 100%,92% 30%,88% 100%,84% 30%,80% 100%,76% 30%,72% 100%,68% 30%,64% 100%,60% 30%,56% 100%,52% 30%,48% 100%,44% 30%,40% 100%,36% 30%,32% 100%,28% 30%,24% 100%,20% 30%,16% 100%,12% 30%,8% 100%,4% 30%,0 100%);
}

/* -- the chalkboard: plates on the counter ---------------------------------- */
.chalk {
  left:794px; top:176px; width:264px; padding:12px 14px 14px; text-align:center;
  background:
    radial-gradient(120% 90% at 50% 0%, rgb(255 255 255 / .045), rgb(255 255 255 / 0) 60%),
    #1d1410;
  border:6px solid var(--wood-dk); border-top-color:#8a6244;
  border-radius:8px;
  filter: var(--drop-flat);
}
.chalk h2 {
  margin:0; font-size:10.5px; font-weight:800; letter-spacing:.13em;
  text-transform:uppercase; color:var(--cream-mute); white-space:nowrap;
}
.chalk .n {
  display:block; margin-top:2px; font-size:76px; line-height:1; font-weight:800;
  color:var(--cream); font-variant-numeric:tabular-nums;
  text-shadow:0 3px 0 rgb(0 0 0 / .5);
}
.chalk .n[data-bare="true"] { color:var(--red); }
.chalk .u { display:block; font-size:14px; font-weight:700; color:var(--cream-dim); letter-spacing:.06em; }

/* -- the till: wooden cash box ---------------------------------------------- */
.till {
  right:32px; top:214px; width:254px;
  background:
    repeating-linear-gradient(180deg, rgb(0 0 0 / 0) 0 15px, rgb(0 0 0 / .05) 15px 16px),
    linear-gradient(180deg, var(--wood-hi), var(--wood-mid) 42%, var(--wood-dk));
  border-radius:10px; border-top:2px solid #c49a6c;
  filter: var(--drop-sit);
}
.till h2 {
  margin:0; padding:9px 0 8px; text-align:center;
  font-size:11.5px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
  color:#2b3236;
  background: linear-gradient(180deg, var(--steel-hi), var(--steel-mid) 60%, var(--steel-dk));
  border-radius:8px 8px 0 0;
  text-shadow:0 1px 0 rgb(255 255 255 / .35);
}
.till dl { margin:0; padding:12px 16px 10px; display:grid; gap:9px; }
.till .row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.till .row--money {
  margin:0 -6px 2px; padding:5px 10px 6px; border-radius:6px;
  background:#1a100c; box-shadow: inset 0 2px 0 rgb(0 0 0 / .55), 0 1px 0 rgb(255 214 150 / .18);
}
.till dt { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#f0e2c4; }
.till dd { margin:0; font-weight:800; font-variant-numeric:tabular-nums; color:var(--cream); font-size:17px; }
.till dd.money { font-size:26px; color:var(--green); text-shadow:0 2px 0 rgb(0 0 0 / .4); }
.till dd[data-loss="true"] { color:var(--red); }
.till .drawer {
  margin:4px 10px 12px; height:40px; position:relative;
  background: linear-gradient(180deg, var(--steel-mid), var(--steel-dk) 70%, var(--steel-deep));
  border-radius:6px; box-shadow: inset 0 2px 0 var(--steel-hi), inset 0 -3px 0 rgb(0 0 0 / .35);
}
.till .drawer::before { /* handle */
  content:""; position:absolute; left:50%; top:50%; width:56px; height:12px;
  transform:translate(-50%,-50%); border-radius:999px;
  background: linear-gradient(180deg, #f2d9ad, var(--amber) 60%, var(--amber-deep));
}

/* -- controls: enamelled plaques mounted on the counter front ---------------- */
.controls { left:352px; top:552px; display:flex; align-items:center; gap:22px; }
button { font-family:var(--font); cursor:pointer; }
.btn-serve {
  min-width:296px; min-height:66px; padding:0 30px;
  font-size:21px; font-weight:800; letter-spacing:.02em; color:#2a1708;
  background: linear-gradient(180deg, #ffc978, var(--amber) 55%, #dd8f2c);
  border:0; border-bottom:7px solid var(--amber-deep); border-radius:12px;
  text-shadow:0 1px 0 rgb(255 255 255 / .35);
  filter: var(--drop-flat);
}
.btn-auto {
  min-height:54px; padding:0 24px;
  font-size:15px; font-weight:800; letter-spacing:.02em; color:#1d2326;
  background: linear-gradient(180deg, var(--steel-hi), var(--steel-mid) 60%, #8e979e);
  border:0; border-bottom:6px solid var(--steel-deep); border-radius:10px;
  text-shadow:0 1px 0 rgb(255 255 255 / .4);
  filter: var(--drop-flat);
}
.btn-auto[aria-pressed="true"] {
  background: linear-gradient(180deg, #fff1d6, var(--amber-hi) 60%, #e0a446);
  border-bottom-color:var(--amber-deep); color:#2a1708;
}
button:focus-visible { outline:3px solid var(--amber-hi); outline-offset:3px; }
@media (prefers-reduced-motion: no-preference) {
  .btn-serve, .btn-auto { transition: transform 120ms ease, filter 120ms ease; }
  .btn-serve:hover, .btn-auto:hover { transform:translateY(-2px); }
  .btn-serve:active, .btn-auto:active { transform:translateY(3px); filter:drop-shadow(0 1px 0 rgb(10 5 2 / .45)); }
}
.progress {
  left:952px; top:572px; margin:0; font-size:15px; font-weight:700;
  color:var(--cream-dim); font-variant-numeric:tabular-nums;
}

/* -- stencil on the apron (decorative, duplicated in the top bar) ------------ */
.stencil {
  left:44px; top:496px; margin:0;
  font-size:12px; font-weight:800; letter-spacing:.24em; text-transform:uppercase;
  color:#6f4c33;
}

/* -- alert note (used by states; kept here so both files share one language) - */
.note {
  left:340px; top:472px; width:566px; margin:0; padding:12px 18px 12px 22px;
  background: linear-gradient(180deg, var(--paper-hi), var(--paper-mid) 60%, var(--paper-dk));
  color:var(--red-ink); font-size:15.5px; font-weight:700;
  border-left:10px solid #c0402a; border-radius:6px;
  transform:rotate(-.4deg);
  filter: var(--drop-flat);
}
.note strong { font-size:19px; }

.visually-hidden {
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}


/* ---- states sheet layout -------------------------------------------------- */
body { width:1366px; height:768px; overflow:hidden; background:#080403; }
.sheet { padding:8px 16px 0; }
.sheet > h1 {
  margin:0 0 3px; font-size:13px; font-weight:800; letter-spacing:.22em;
  text-transform:uppercase; color:#b99b78;
}
.grid { display:grid; grid-template-columns:595px 595px; gap:4px 16px; justify-content:center; }
.credo { margin:10px 0 0; text-align:center; font-size:11.5px; color:#b99b78; letter-spacing:.04em; }
.cell figcaption {
  margin:0 0 2px; font-size:11.5px; font-weight:700; letter-spacing:.04em;
  color:#d8c3a4;
}
.cell { margin:0; }
.vp { width:595px; height:308px; overflow:hidden; border-radius:6px; outline:1px solid #3a2a21; }
.frame { width:1366px; height:768px; transform:scale(.4355); transform-origin:0 0; position:relative; background:var(--night-0); }
.count--empty { color:var(--cream-mute); font-size:15px; }
.frame .note {
  left:340px; top:481px; width:auto; max-width:700px; white-space:nowrap;
  font-size:14.5px; padding:9px 16px 9px 18px; border-left-width:8px;
  transform:rotate(-.3deg);
}
.frame .note strong { font-size:16.5px; }
.frame .stencil { display:none; }
.closed-tag {
  left:520px; top:214px; margin:0; padding:10px 26px;
  font-size:20px; font-weight:800; letter-spacing:.3em; text-transform:uppercase;
  color:#e8d9bd; background:#241610; border:3px solid #553823; border-radius:8px;
  transform:rotate(-2deg); filter:var(--drop-hang);
}
.closed-tag::before {
  content:""; position:absolute; top:-24px; left:50%; width:3px; height:24px; background:#503626;
}

/* ---- specimen cell -------------------------------------------------------- */
.spec {
  width:595px; height:308px; overflow:hidden; padding:10px 16px 8px;
  background:#17100e; border-radius:6px; outline:1px solid #3a2a21;
  display:grid; align-content:start; gap:5px;
}
.spec__title {
  margin:0; font-size:11px; font-weight:800; letter-spacing:.2em;
  text-transform:uppercase; color:#b99b78;
}
.spec__row { display:flex; align-items:center; gap:12px; min-width:0; max-width:569px; }
.spec__label {
  flex:none; width:150px; font-size:9.5px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:#d8c3a4; line-height:1.4;
}
.spec__note { margin:-2px 0 0; max-width:562px; font-size:10px; line-height:1.35; color:#b99b78; }
.spec-chit {
  flex:none; position:relative; display:inline-flex; align-items:baseline; gap:8px;
  padding:8px 10px; border-radius:6px; color:var(--paper-ink);
  background:linear-gradient(180deg, var(--paper-hi), var(--paper-mid) 55%, var(--paper-dk));
  filter:drop-shadow(0 3px 0 rgb(10 5 2 / .45));
}
.spec-chit .no { font-family:var(--mono); font-weight:700; font-size:12px; }
.spec-chit .qty { font-size:10.5px; font-weight:700; }
.spec-chit--walked {
  background:linear-gradient(180deg, #b7bfcd, #8b94a6 55%, #5d6575);
  color:#232a36; transform:rotate(-3deg);
}
.spec-chit--walked::after {
  content:""; position:absolute; left:4px; right:4px; top:50%; height:2.5px;
  background:#39404e; transform:rotate(-4deg);
}
.spec-chit--arena {
  background:linear-gradient(180deg, #ffffff, #e8ecf4 55%, #c2cad8);
  color:#0d2148;
}
.spec-ticket {
  flex:none; display:grid; place-items:center; width:78px; height:40px; border-radius:4px;
  background:linear-gradient(180deg, var(--paper-hi), var(--paper-mid) 60%, var(--paper-dk));
  filter:drop-shadow(0 3px 0 rgb(10 5 2 / .45));
}
.spec-ticket .st {
  font-style:normal; font-size:10px; font-weight:800; letter-spacing:.14em;
  text-transform:uppercase; padding:4px 8px; border:2px solid; border-radius:999px;
  transform:rotate(-6deg);
}
.st--green { color:#1f7a4d; border-color:#1f7a4d; }
.st--red { color:#b3301f; border-color:#b3301f; }
.btn--mini { min-width:0; min-height:32px; font-size:12px; padding:0 13px; border-bottom-width:4px; }
.swap { flex:none; display:inline-flex; align-items:center; gap:4px; color:#8a6a49; font-size:11px; }
.swap i { width:20px; height:20px; border-radius:6px; display:inline-block; }
.swap em { font-style:normal; font-size:9px; color:#b99b78; letter-spacing:.02em; width:58px; line-height:1.3; }

</style>
</head>
<body>
<div class="sheet">
<h1>Direction B &mdash; the same screen, reacting to real state</h1>
<div class="grid">

<figure class="cell">
  <figcaption>18:10 &mdash; doors just open. Full pans, a full lane, the first ticket at the pass.</figcaption>
  <div class="vp">
<div class="frame">
<header class="topbar">
  <span class="mark">B<i>&#9670;</i>W</span>
  <span class="crumb">Run the Pop-Up &mdash; <b>Riverside Night Market &middot; Middle Row</b></span>
  <span class="right">Saturday service</span>
</header>
<main class="stage">
  
  <svg class="backdrop" viewBox="0 0 1366 720" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="sky-a" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#170c10"/><stop offset=".55" stop-color="#331d1e"/>
        <stop offset="1" stop-color="#5e3527"/>
      </linearGradient>
      <radialGradient id="glow-a" cx=".5" cy=".9" r=".75">
        <stop offset="0" stop-color="#f0a94a" stop-opacity=".16"/>
        <stop offset="1" stop-color="#f0a94a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="body-a" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d6b489"/><stop offset=".7" stop-color="#c2a075"/>
        <stop offset="1" stop-color="#a9895f"/>
      </linearGradient>
      <linearGradient id="winglow-a" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe2a8"/><stop offset="1" stop-color="#f0a343"/>
      </linearGradient>
      <linearGradient id="ctop-a" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a87b52"/><stop offset="1" stop-color="#8a6244"/>
      </linearGradient>
      <linearGradient id="apron-a" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a2e1f"/><stop offset="1" stop-color="#2c1a12"/>
      </linearGradient>
      <linearGradient id="pan-a" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9aa2a9"/><stop offset="1" stop-color="#6b7178"/>
      </linearGradient>
      <radialGradient id="vig-a" cx=".5" cy=".45" r=".85">
        <stop offset=".62" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".38"/>

<figure class="cell">
  <figcaption>The language as a system &mdash; what another artist extends</figcaption>
  
<div class="spec">
  <h2 class="spec__title">The object family &mdash; one hand, specimen sheet</h2>

  <div class="spec__row">
    <span class="spec__label">Paper carries people. Two losses, two objects:</span>
    <span class="spec-chit"><span class="no">#22</span><span class="qty">3 plates</span></span>
    <span class="spec-chit spec-chit--walked"><span class="no">#14</span><span class="qty">walked</span></span>
    <span class="spec-ticket"><i class="st st--green">Served</i></span>
    <span class="spec-ticket"><i class="st st--red">Sold out</i></span>
  </div>
  <p class="spec__note">A hands loss is struck slate and leaves the rail &mdash; it never reaches the pass.
  A stock loss is stamped red at the pass, over a bare pan. Walked chits appear only on nights
  where the crowd outruns one pair of hands.</p>
