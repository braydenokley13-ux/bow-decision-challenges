<!doctype html>
<!--
  Direction C bake master v2: the Middle Row lane, seen from behind the counter.

  AUTHORING-TIME ONLY. Deliberately expensive — a Chromebook never runs it. Rendered once
  through scripts/bake-art.mjs; ships as one WebP.

  Optics: focal plane is the counter (the live DOM in front of this image), so everything here
  is beyond focus, mildly for the lane, heavily for the bridge. Blur is also the evidence
  firewall: the crowd is deliberately uncountable — overlapping, cropped by frame, soft — and
  this image is CONSTANT across all world states. State response happens in CSS grade layers.

  Canvas 1920x420. Display crop loses ~20px top and bottom at 1366-wide cover.
  Light: stall lamps + lantern strings, warm amber; the sky holds the last of the blue hour.
-->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#0d0806;overflow:hidden}
  svg{display:block}
</style></head><body>
<svg width="1920" height="420" viewBox="0 0 1920 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ============ gradients ============ -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#191130"/>
      <stop offset="0.34" stop-color="#2e1e3d"/>
      <stop offset="0.62" stop-color="#553137"/>
      <stop offset="0.84" stop-color="#8f4e2d"/>
      <stop offset="1"    stop-color="#c67a3c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3d2413"/>
      <stop offset="0.25" stop-color="#28180b"/>
      <stop offset="1"    stop-color="#120a05"/>
    </linearGradient>
    <radialGradient id="stall-core" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0"   stop-color="#ffd489"/>
      <stop offset="0.5" stop-color="#e89040"/>
      <stop offset="1"   stop-color="#8a4318" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffe0a0" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffb85c" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ff9d3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern-paper" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0"   stop-color="#ffe6b0"/>
      <stop offset="0.72" stop-color="#f5a548"/>
      <stop offset="1"   stop-color="#b45f1e"/>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4a2c48"/>
      <stop offset="0.4" stop-color="#5c3538"/>
      <stop offset="1"   stop-color="#2c1a0e"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#d98440" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#d98440" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#d98440" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221433"/>
      <stop offset="0.78" stop-color="#48283a"/>
      <stop offset="1" stop-color="#b8653c"/>
    </linearGradient>
    <linearGradient id="vign-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0503" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b0503" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vign-r" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0b0503" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b0503" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vign-b" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b0503" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0b0503" stop-opacity="0"/>
    </linearGradient>

    <!-- ============ depth-of-field ============ -->
    <filter id="f-far"  x="-12%" y="-30%" width="124%" height="160%"><feGaussianBlur stdDeviation="5.5"/></filter>
    <filter id="f-mid"  x="-10%" y="-25%" width="120%" height="150%"><feGaussianBlur stdDeviation="2.1"/></filter>
    <filter id="f-near" x="-10%" y="-25%" width="120%" height="150%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="f-soft" x="-10%" y="-25%" width="120%" height="150%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <filter id="f-bloom" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="f-glow"  x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="f-rim"   x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="f-steam" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>

        <path d="M124 -72 l -22 14 l 3.5 6.5 l 21 -11 z"/>

      <!-- two hanging work lamps -->

        <path d="M77 -114 h22 l5 9 h-32 z" fill="#241208"/>
        <circle cx="88" cy="-101" r="5" fill="#ffe9bb"/>
        <circle cx="88" cy="-101" r="15" fill="url(#lamp-halo)"/>
        <line x1="176" y1="-128" x2="176" y2="-116" stroke="#120a05" stroke-width="2.5"/>
        <path d="M166 -116 h20 l5 8 h-30 z" fill="#241208"/>
        <circle cx="176" cy="-104" r="4.5" fill="#ffe9bb"/>
        <circle cx="176" cy="-104" r="13" fill="url(#lamp-halo)"/>
      </g>
      <!-- canopy -->
      <path d="M0 -128 L28 -178 H232 L260 -128 Z" fill="var(--canopy,#7a3b26)"/>
      <path d="M28 -178 H232 L260 -128 H130 Z" fill="#000000" opacity="0.18"/>
      <path d="M4 -133 H256 L260 -128 H0 Z" fill="var(--canopy-lit,#a85a34)"/>
      <path d="M0 -128 h260 v5
               a13 11 0 0 1 -26 0 a13 11 0 0 1 -26 0 a13 11 0 0 1 -26 0 a13 11 0 0 1 -26 0
               a13 11 0 0 1 -26 0 a13 11 0 0 1 -26 0 a13 11 0 0 1 -26 0 a13 11 0 0 1 -26 0

    </g>

      <path d="M-1.5 -43 h3 l0.8 3 h-4.6 z"/>

      <path d="M3 -34 l8 -2 l1 2.6 l-8 2.6 z"/>
      <ellipse cx="12" cy="-37" rx="5" ry="1.7" fill="#e8c07a"/>
    </g>
    <g id="fig-bag">
      <circle cx="0" cy="-49" r="6.2"/>
      <path d="M-1.5 -43 h3 l0.8 3 h-4.6 z"/>
      <path d="M-8 -12 l-1 -14 c-0.6 -8 2 -13 5 -14 h8 c3 1 5.6 6 5 14 l-0.6 9 l1.6 5 l-2.6 1 l-2 -4.6 l-0.4 3.6 l-1.6 12 h-3.4 l-0.6 -11 h-3.8 l-0.6 11 h-3.4 z"/>

      <path d="M10 -16 c0 -3 5 -3 5 0" fill="none" stroke-width="1.4" stroke="#000"/>
    </g>
    <g id="fig-kid">
      <g transform="scale(0.68)">
        <circle cx="0" cy="-47" r="7.4"/>
        <path d="M-1.5 -40 h3 l0.8 3 h-4.6 z"/>
        <path d="M-7.5 -10 l-1 -13 c-0.6 -8 2 -13 5 -14 h7 c3 1 5.6 6 5 14 l-1 13 l-1.6 10 h-3.4 l-0.6 -9 h-3 l-0.6 9 h-3.4 z"/>
      </g>
    </g>

    <!-- pendant bulb hanging from the wire -->
    <g id="bulb">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1c0f08" stroke-width="1.8"/>
      <circle cy="12" r="16" fill="#ff9d3a" opacity="0.45" filter="url(#f-bloom)"/>
      <circle cy="12" r="8" fill="#ffb85c" opacity="0.5" filter="url(#f-glow)"/>

    <g id="bulb-sm">

      <circle cy="8" r="7" fill="#ffb85c" opacity="0.4" filter="url(#f-glow)"/>
      <circle cy="8" r="2.4" fill="#ffe2a8"/>
    </g>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.5 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- ================= SKY ================= -->
  <rect width="1920" height="248" fill="url(#sky)"/>
  <g fill="#cdbde0">
    <circle cx="140" cy="38" r="1.1" opacity="0.7"/><circle cx="290" cy="22" r="0.9" opacity="0.5"/>

  <rect x="0" y="248" width="1920" height="172" fill="url(#ground)"/>

    <rect x="1380" y="176" width="540" height="52" fill="#d98440" opacity="0.55"/>

    <rect x="1380" y="240" width="540" height="90" fill="#0e0812" opacity="0.5"/>

      <rect x="1414" y="228" width="3" height="4"/><rect x="1424" y="220" width="3" height="4"/>
      <rect x="1448" y="216" width="3" height="4"/><rect x="1458" y="226" width="3" height="4"/>
      <rect x="1484" y="204" width="3" height="4"/><rect x="1492" y="214" width="3" height="4"/>
      <rect x="1522" y="228" width="3" height="4"/><rect x="1548" y="220" width="3" height="4"/>

      <rect x="1652" y="222" width="3" height="4"/><rect x="1682" y="216" width="3" height="4"/>

  <!-- hanging paper lanterns: crisper than the stalls behind them, ribbed, hot-cored -->
  <g filter="url(#f-near)">
    <g transform="translate(396,152)">
